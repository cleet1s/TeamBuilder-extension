<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Madden Roster Toolkit</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1a1a2e;
    }
    header {
      padding: 14px 16px 10px;
      background: #1a1a2e;
      color: #fff;
    }
    header h1 { font-size: 14px; margin: 0; }
    .body { padding: 14px 16px; }
    .roster-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .status { font-size: 12px; margin-bottom: 12px; }
    .status.ok { color: #2b9348; }
    .status.problem { color: #e5383b; }
    .status.none { color: #6b7080; }
    button {
      width: 100%;
      padding: 9px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid #d0d3e0;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    button.primary { background: #4361ee; border-color: #4361ee; color: #fff; }
    button:hover { filter: brightness(0.97); }
    #site-status { font-size: 12px; color: #6b7080; margin-top: 6px; text-align: center; }
  </style>
</head>
<body>
  <header><h1>Madden Roster Toolkit</h1></header>
  <div class="body">
    <div class="roster-name" id="roster-name">No roster selected</div>
    <div class="status" id="roster-status"></div>
    <button id="open-options">Open Roster Editor</button>
    <button id="import-btn" class="primary">Push Roster to Team Builder</button>
    <div id="site-status"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
